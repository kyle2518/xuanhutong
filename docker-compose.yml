name: xuanhutong

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xuanhutong}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  gateway:
    image: xuanhutong-gateway:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      MEDICAL_SERVICE_URI: http://medical-service:8082
      CLINIC_SERVICE_URI: http://clinic-service:8083
      PRESCRIPTION_SERVICE_URI: http://prescription-service:8084
      AI_SERVICE_URI: http://ai-service:8085
      RAG_SERVICE_URI: http://rag-service:8000
    depends_on:
      - auth-service
      - medical-service
      - clinic-service
      - prescription-service
      - rag-service
    networks: [app]

  auth-service:
    image: xuanhutong-auth-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xuanhutong}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app]

  medical-service:
    image: xuanhutong-medical-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: medical-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xuanhutong}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_UPLOAD_PATH: /app/uploads
    volumes:
      - medical-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app]

  clinic-service:
    image: xuanhutong-clinic-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: clinic-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xuanhutong}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app]

  prescription-service:
    image: xuanhutong-prescription-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: prescription-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xuanhutong}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app]

  frontend:
    image: xuanhutong-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
    networks: [app]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [app]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [app]

  milvus:
    image: milvusdb/milvus:v2.6.22
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    security_opt:
      - seccomp:unconfined
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
    networks: [app]

  ai-service:
    image: xuanhutong-ai-service:latest
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-xuanhutong}
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      MILVUS_URI: http://milvus:19530
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks: [app]

  rag-service:
    image: xuanhutong-rag-service:latest
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAG_MILVUS_URI: http://milvus:19530
      RAG_MILVUS_TOKEN: ${RAG_MILVUS_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://api.openai.com/v1}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
      RAG_LLM_TEMPERATURE: ${RAG_LLM_TEMPERATURE:-0.2}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-5}
      RAG_MAX_FILE_SIZE_MB: ${RAG_MAX_FILE_SIZE_MB:-20}
      RAG_METADATA_DB_PATH: /app/data/rag_metadata.db
    volumes:
      - rag-data:/app/data
    depends_on:
      milvus:
        condition: service_healthy
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  mysql-data:
  medical-uploads:
  etcd-data:
  minio-data:
  milvus-data:
  rag-data:
