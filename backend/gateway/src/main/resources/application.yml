server:
  port: 8080

spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: medical-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/patients/**,/api/records/**
        - id: clinic-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**,/api/appointments/**,/api/files/**
        - id: prescription-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/prescriptions/**,/api/herbs/**,/api/classic-prescriptions/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
  main:
    web-application-type: reactive
