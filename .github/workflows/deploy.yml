name: Build & Deploy (Self-hosted)

# ⚠️ 公共仓库安全铁律：只允许 push 到 main 触发。
#    绝不要加 pull_request / pull_request_target，
#    否则 fork 的 PR 会在你的 runner 上执行任意代码。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一次，避免并发部署互相踩
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 .env（密钥来自 GitHub Secrets，不落盘到仓库）
        env:
          DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT: ${{ secrets.JWT_SECRET }}
          APP_HOST: ${{ vars.APP_HOST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
        run: |
          printf 'MYSQL_ROOT_PASSWORD=%s\n' "$DB_PASSWORD" > .env
          printf 'MYSQL_DATABASE=xuanhutong\n'       >> .env
          printf 'JWT_SECRET=%s\n' "$JWT"            >> .env
          printf 'APP_BASE_URL=http://%s\n' "$APP_HOST" >> .env
          printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY" >> .env
          printf 'EMBEDDING_API_KEY=%s\n' "$EMBEDDING_API_KEY" >> .env

      - name: 检测变更的服务
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
          fi
          SERVICES=""
          # Java 后端（common 被所有 Java 服务依赖，共用一个 Dockerfile）
          if echo "$CHANGED" | grep -q '^backend/'; then
            SERVICES="$SERVICES gateway auth-service medical-service clinic-service prescription-service"
          fi
          # shared 被 ai-service 和 rag-service 共同依赖
          if echo "$CHANGED" | grep -qE '^(ai-service/|shared/)'; then
            SERVICES="$SERVICES ai-service rag-service"
          fi
          if echo "$CHANGED" | grep -q '^frontend/'; then
            SERVICES="$SERVICES frontend"
          fi
          # 未检测到变更（首次/手动）则全量构建
          if [ -z "$SERVICES" ]; then
            SERVICES="gateway auth-service medical-service clinic-service prescription-service ai-service rag-service frontend"
          fi
          echo "检测到变更，构建服务：$SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: 构建镜像（串行，避免 Gradle 缓存锁冲突）
        run: |
          for svc in ${{ steps.changed.outputs.services }}; do
            echo "==> 构建 $svc"
            docker compose build "$svc"
          done

      - name: 滚动更新
        run: |
          docker compose up -d --remove-orphans
          docker image prune -f
